name: Build docs

on:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "latest"
      - name: setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
      - name: Build MkDocs documentation
        run: |
          uv venv
          . .venv/bin/activate
          uv sync --group docs
          just docs-build --clean
        working-directory: .

      - name: Publish docs to GH Pages
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Documentation versioning was removed: publish the freshly built site at
          # the gh-pages root. A separate worktree keeps the build output untouched.
          # Existing gh-pages content (e.g. archived version directories, CNAME,
          # .nojekyll) is left in place — only the root documentation is refreshed.
          git worktree add gh-pages-publish gh-pages
          rsync -a ./site/ gh-pages-publish/

          cd gh-pages-publish
          git add -A
          git commit -m "docs: deploy docs" || echo "No documentation changes to deploy"
          git push origin gh-pages
