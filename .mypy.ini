[mypy]
files = src/faststream_fastapi, tests

num_workers = auto
python_version = 3.11

strict = true
strict_bytes = true
local_partial_types = true
# This enables fast Rust-based parser that parses directly to mypy AST
native_parser = true

enable_error_code =
  truthy-bool,
  truthy-iterable,
  redundant-expr,
  unused-awaitable,
  ignore-without-code,
  possibly-undefined,
  redundant-self,
  explicit-override,
  mutable-override,
  unimported-reveal,
  deprecated,
